project:
  type: website
  output-dir: _site
  # Указываем Quarto, что файл CNAME нужно копировать в финальную сборку
  resources:
    - CNAME

website:
  title: "bushukovee posts"
  site-url: https://bushukovee-devops.ru
  repo-url: https://github.com
  repo-branch: master
  repo-actions: [edit, source]
  navbar:
    left:
      - href: index.qmd
        text: Posts
      - about.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true

editor: source
